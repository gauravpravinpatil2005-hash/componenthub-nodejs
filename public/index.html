<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ComponentHub - Electronics Lab Component Requests</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>ComponentHub</h1>
    <p>Electronics Lab Component Request &amp; Validation System</p>
  </header>

  <main>
    <section class="card">
      <h2>Request a Component</h2>
      <div id="banner" class="banner hidden"></div>
      <form id="requestForm" novalidate>
        <div class="grid">
          <label>Full Name<input name="name" placeholder="e.g. Gaurav Pravin Patil"><span class="err" data-for="name"></span></label>
          <label>PRN<input name="prn" placeholder="12-digit PRN" maxlength="12"><span class="err" data-for="prn"></span></label>
          <label>Email<input name="email" type="email" placeholder="you@example.com"><span class="err" data-for="email"></span></label>
          <label>Department
            <select name="department">
              <option value="">-- Select --</option>
              <option>E&amp;TC</option><option>Computer</option><option>IT</option>
              <option>AI&amp;DS</option><option>Mechanical</option><option>Civil</option>
            </select><span class="err" data-for="department"></span>
          </label>
          <label>Component Category
            <select name="category">
              <option value="">-- Select --</option>
              <option>Microcontroller</option><option>Sensor</option><option>Resistor/Capacitor</option>
              <option>Integrated Circuit</option><option>Display Module</option>
              <option>Communication Module</option><option>Power Supply</option>
            </select><span class="err" data-for="category"></span>
          </label>
          <label>Component Name<input name="componentName" placeholder="e.g. Arduino Uno R3"><span class="err" data-for="componentName"></span></label>
          <label>Quantity (1-10)<input name="quantity" type="number" placeholder="1"><span class="err" data-for="quantity"></span></label>
          <label>Lab Date<input name="labDate" type="date"><span class="err" data-for="labDate"></span></label>
        </div>
        <label>Purpose<textarea name="purpose" rows="4" placeholder="Why do you need this component?"></textarea><span class="err" data-for="purpose"></span></label>
        <button type="submit">Submit Request</button>
      </form>
    </section>

    <section class="card">
      <h2>Submitted Requests <button id="refresh" class="small">Refresh</button></h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>ID</th><th>Name</th><th>Component</th><th>Qty</th><th>Lab Date</th><th>Priority</th><th>Status</th></tr></thead>
          <tbody id="rows"><tr><td colspan="7">No requests yet.</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer>Gaurav Pravin Patil | PRN 202401100049 | Practical No. 04</footer>
  <script src="script.js"></script>
</body>
</html>
